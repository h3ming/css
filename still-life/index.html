<style>

  * { box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    
  }

  .frame {
    position: relative;
    width: 500px;
    height: 500px;
    border: 1px dashed;
    overflow: hidden;
  }
  
  img {
    width: 500px;
    opacity: 0.2;
    position: absolute;
    left: -10px;
    z-index: 2;
  }
  
  .table {
    position: absolute;
    width: 100%;
    height: 40%;
    z-index: -1;
    background: gray;
    top: 63%;
    transform: rotate(-2deg);
  }
  
  .moka-box {
    position: absolute;
    background: orange;
    width: 28%;
    height: 38%;
    top: 21%;
    left: 25%;
    clip-path: polygon(25% 13%, 75% 13%, 100% 24%, 91% 100%, 8% 100%, 0 25%);
    display: flex;
    align-content: center;
    justify-content: center;
  }
  
  .moka-box::before {
    position: absolute;
    content: "";
    background: black;
    width: 40%;
    height: 30%;
    top: -20%;
  }
  
  .bust-box {
    position: absolute;
    background: yellow;
    z-index: 1;
    width: 40%;
    height: 50%;
    top: 40%;
    left: 38%;
/*     display: flex;
    justify-content: center;
    align-content: center; */
  }
  
  .bust {
    position: absolute;
    border-color: 1px solid red;
    background: blue;
    width: 50%;
    height: 70%;
    top: 20%;
    
  }
  
  .lcups-box {
    position: absolute;
    background: red;
    width: 15%;
    height: 30%;
    top: 53%;
    left: 25%;
    z-index: 0;
  }
  
  .tcup-box {
    position: absolute;
    background: red;
    width: 21%;
    height: 18%;
    top: 30%;
    left: 39%;
    z-index: 1;
  }

</style>

<div class="reference">
  
</div>

<div class="frame">
  <img src="reference.JPG" alt="my ref image">
  <div class="table"></div>
  <div class="moka-box"></div>
  <div class="bust-box">
    <div class="bust" id="bust-front"></div>
    <div class="bust" id="bust-back"></div>
  </div>
  <div class="lcups-box"></div>
    <div class="cup" id="topcup"></div>
    <div class="cup" id="bottomcup"></div>
  <div class="tcup-box"></div>
</div>
